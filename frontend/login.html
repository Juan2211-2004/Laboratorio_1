<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | AcademicHub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-container">
    <section class="login-card">
      <div class="login-brand">
        <div class="login-logo">🎓</div>
        <h1>AcademicHub</h1>
        <p>Tu espacio académico</p>
      </div>
      <div class="login-heading">
        <h2>¡Bienvenido!</h2>
        <p>Ingresa tus credenciales para organizar tu vida académica.</p>
      </div>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="estudiante@academichub.com" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
        </div>
        <p id="loginError" class="login-error" aria-live="polite"></p>
        <button type="submit" class="login-button">Iniciar sesión</button>
      </form>
      <div class="login-footer">
        <p>AcademicHub © 2026</p>
        <span>Plataforma de organización académica</span>
      </div>
    </section>
  </main>
  <script src="auth.js"></script>
</body>
</html>
